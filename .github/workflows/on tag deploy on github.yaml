name: "Build and Release Linux Binary"

env:
  REPO_NAME: "nhentai_archivist"
  RUST_VERSION: "1.86"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: "Build Linux Binary"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: "Build Linux Executable"
        run: cargo build --release

      - name: "Set Release Info"
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="manual-$(date +'%Y.%m.%d-%H%M%S')"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "binary_path=target/release/${{ env.REPO_NAME }}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${{ env.REPO_NAME }}-$TAG_NAME-linux" >> "$GITHUB_OUTPUT"

      - name: "Upload Workflow Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.binary_path }}

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "${{ steps.meta.outputs.date }} ${{ env.REPO_NAME }} ${{ steps.meta.outputs.tag_name }}"
          generate_release_notes: true
          files: ${{ steps.meta.outputs.binary_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
