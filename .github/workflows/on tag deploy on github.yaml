name: "On Tag Deploy on GitHub"

env:
  REPO_NAME: "nhentai_archivist"
  RUST_VERSION: "1.86"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build_and_release:
    name: "Build Linux Executable and Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: "Get Version"
        id: version
        run: |
          project_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: "Verify Tag Matches Cargo Version"
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag (${{ github.ref_name }}) does not match Cargo version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: "Build Linux Executable"
        run: cargo build --release

      - name: "Prepare Artifact Name"
        id: artifact
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "binary_path=target/release/${{ env.REPO_NAME }}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${{ env.REPO_NAME }}-${{ github.ref_name }}-linux" >> "$GITHUB_OUTPUT"

      - name: "Upload Workflow Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.binary_path }}

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.artifact.outputs.date }} ${{ env.REPO_NAME }} ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.binary_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
